[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generateProtenixjson"
version = "0.1.0"

[project.scripts]
generateforprotenix = "generateProtenixjson.generateTemplate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"template" = ["template/*.json"]